[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in argument defaults is the framework's intended style
    "B905",  # zip() without strict= is intentional where lengths are already guaranteed
    "E501",  # long lines are left to the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "analytics", "backend_test_helpers"]
