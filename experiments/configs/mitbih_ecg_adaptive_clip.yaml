title: "3c. Privacy cost with adaptive clipping: ECG, MIT-BIH"
description: >
  PROPOSED, NOT RUN: waiting for approval of the settings below. Same data, split, seeds, rounds and noise grid as
  3b; the only change is the clip norm, which adapts (Andrew et al., NeurIPS 2021) instead of staying at 1.0. Each
  hospital clips with the round's clip norm C, sends its clipping bit with Gaussian noise (sigma_b) and its update
  with noise z_update x C, where z_update = (z^-2 - (2 sigma_b)^-2)^(-1/2); together they cost the same as a 3b
  round with noise multiplier z, so the epsilon column is comparable with 3b. After aggregation the coordinator sets
  C <- C x exp(-eta (mean noised bit + 1/2 - 0.5)): the clip norm moves towards the median update norm (target
  quantile 0.5). sigma_b takes 10% of each round's budget: sigma_b = z / (2 sqrt(0.1)). The sigma = 0 row is the
  no-DP reference, rerun here with the same thread count. Under adaptive clipping the hospitals' raw update norms
  are not reported (they would reveal the bit), so the median-norm column is empty; the clip norm per round and the
  estimated share of unclipped updates are reported instead. Fixed before any run.
dataset:
  modality: ecg
  source: mit-bih
  csv: ["${MITBIH_DIR}/mitbih_train.csv", "${MITBIH_DIR}/mitbih_test.csv"]
  max_records: 25000
  subsample_seed: 0
training: {rounds: 20}
target_f1: 0.8
partition: {scheme: dirichlet, alpha: 1.0}
methods: [fedavg]
# Shared by every DP row: starting clip norm 1.0 (3b's fixed value), target quantile 0.5, eta 0.2 (the paper's
# default), 10% of the budget to the bit.
variants:
  - {label: "sigma=0 (no DP)"}
  - {label: "sigma=0.001, adaptive", dp: {enabled: true, clip_norm: 1.0, noise_multiplier: 0.001, adaptive_clipping: true, target_quantile: 0.5, clip_learning_rate: 0.2, quantile_budget_share: 0.1}}
  - {label: "sigma=0.003, adaptive", dp: {enabled: true, clip_norm: 1.0, noise_multiplier: 0.003, adaptive_clipping: true, target_quantile: 0.5, clip_learning_rate: 0.2, quantile_budget_share: 0.1}}
  - {label: "sigma=0.01, adaptive", dp: {enabled: true, clip_norm: 1.0, noise_multiplier: 0.01, adaptive_clipping: true, target_quantile: 0.5, clip_learning_rate: 0.2, quantile_budget_share: 0.1}}
  - {label: "sigma=0.03, adaptive", dp: {enabled: true, clip_norm: 1.0, noise_multiplier: 0.03, adaptive_clipping: true, target_quantile: 0.5, clip_learning_rate: 0.2, quantile_budget_share: 0.1}}
  - {label: "sigma=0.1, adaptive", dp: {enabled: true, clip_norm: 1.0, noise_multiplier: 0.1, adaptive_clipping: true, target_quantile: 0.5, clip_learning_rate: 0.2, quantile_budget_share: 0.1}}
  - {label: "sigma=1.0, adaptive", dp: {enabled: true, clip_norm: 1.0, noise_multiplier: 1.0, adaptive_clipping: true, target_quantile: 0.5, clip_learning_rate: 0.2, quantile_budget_share: 0.1}}
