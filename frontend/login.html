<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FL-Health | Login</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            padding: 0;
        }
        .nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
        }
        .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .nav-brand-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        .nav-brand-text { font-size: 20px; font-weight: 700; color: #0c4a6e; }
        .nav-links { display: flex; gap: 4px; align-items: center; }
        .nav-link {
            padding: 10px 14px; font-size: 13px; font-weight: 600;
            color: #0c4a6e; text-decoration: none; border-radius: 10px;
            transition: all 0.2s;
        }
        .nav-link:hover { background: rgba(255, 255, 255, 0.6); }
        .nav-link.primary {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            padding: 10px 18px;
        }

        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            position: relative; width: 100%; max-width: 480px;
            background: #ffffff; border-radius: 24px;
            box-shadow: 0 20px 60px rgba(2, 132, 199, 0.15), 0 4px 20px rgba(2, 132, 199, 0.08);
            padding: 48px 44px;
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .logo-section { text-align: center; margin-bottom: 36px; }
        .logo-icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border-radius: 20px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 34px; margin-bottom: 18px;
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.3);
        }
        .logo-section h1 { font-size: 26px; font-weight: 700; color: #0c4a6e; letter-spacing: -0.5px; margin-bottom: 6px; }
        .logo-section p { font-size: 14px; color: #64748b; }
        .tabs { display: flex; background: #f0f9ff; border-radius: 12px; padding: 4px; margin-bottom: 28px; }
        .tab {
            flex: 1; padding: 12px; text-align: center;
            font-size: 14px; font-weight: 600; color: #64748b;
            border-radius: 9px; cursor: pointer;
            transition: all 0.25s ease; user-select: none;
        }
        .tab.active { background: #ffffff; color: #0284c7; box-shadow: 0 2px 8px rgba(2, 132, 199, 0.15); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 8px; }
        .input-wrapper { position: relative; }
        .input-wrapper .input-icon {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%);
            font-size: 16px; color: #94a3b8; pointer-events: none;
        }
        .input-wrapper input {
            width: 100%; height: 52px; padding: 0 16px 0 46px;
            font-size: 15px; font-family: 'Inter', sans-serif;
            color: #0f172a; background: #f8fafc;
            border: 2px solid #e2e8f0; border-radius: 12px;
            outline: none; transition: all 0.2s ease;
        }
        .input-wrapper input::placeholder { color: #94a3b8; }
        .input-wrapper input:focus { border-color: #38bdf8; background: #ffffff; box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15); }
        .password-toggle {
            position: absolute; right: 16px; top: 50%;
            transform: translateY(-50%);
            font-size: 16px; color: #94a3b8;
            cursor: pointer; background: none; border: none; padding: 4px;
        }
        .form-extras {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; font-size: 13px;
        }
        .remember { display: flex; align-items: center; gap: 8px; color: #475569; cursor: pointer; }
        .remember input { width: 16px; height: 16px; accent-color: #0284c7; cursor: pointer; }
        .forgot-link { color: #0284c7; text-decoration: none; font-weight: 500; }
        .btn-login {
            width: 100%; height: 52px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff; font-size: 15px; font-weight: 600;
            border: none; border-radius: 12px; cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
        }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .footer-link { text-align: center; margin-top: 24px; font-size: 14px; color: #64748b; }
        .footer-link a { color: #0284c7; font-weight: 600; text-decoration: none; margin-left: 4px; }
        .alert { padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; margin-bottom: 18px; display: none; }
        .alert.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .alert.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .alert.show { display: block; }
        @media (max-width: 500px) {
            .nav { padding: 15px 20px; }
            .nav-links .nav-link:not(.primary) { display: none; }
            .login-wrapper { padding: 36px 26px; }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="index.html" class="nav-brand">
            <div class="nav-brand-icon">🏥</div>
            <div class="nav-brand-text">FL-Health</div>
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">Learn FL</a>
            <a href="privacy.html" class="nav-link">Privacy</a>
            <a href="network.html" class="nav-link">Join</a>
            <a href="register.html" class="nav-link primary">Register</a>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-wrapper">
            <div class="logo-section">
                <div class="logo-icon">🏥</div>
                <h1>Welcome Back</h1>
                <p>Sign in to your FL-Health account</p>
            </div>

            <div class="tabs">
                <div class="tab active" id="tabHospital" onclick="switchTab('hospital')">🏥 Hospital</div>
                <div class="tab" id="tabAdmin" onclick="switchTab('admin')">🔐 Admin</div>
            </div>

            <div class="alert" id="alertBox"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📧</span>
                        <input type="email" id="email" placeholder="hospital@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()" id="toggleBtn">👁️</button>
                    </div>
                </div>
                <div class="form-extras">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
            </form>

            <div class="footer-link">Don't have an account?<a href="register.html">Register Hospital</a></div>
        </div>
    </div>

    <script>
        const API_URL = "https://fl-health-y7k0.onrender.com";
        let currentTab = "hospital";

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById("tabHospital").classList.toggle("active", tab === "hospital");
            document.getElementById("tabAdmin").classList.toggle("active", tab === "admin");
            document.getElementById("email").placeholder = tab === "hospital"
                ? "hospital@example.com"
                : "admin@fl-health.com";
        }

        function togglePassword() {
            const pw = document.getElementById("password");
            const btn = document.getElementById("toggleBtn");
            if (pw.type === "password") { pw.type = "text"; btn.textContent = "🙈"; }
            else { pw.type = "password"; btn.textContent = "👁️"; }
        }

        function showAlert(message, type) {
            const box = document.getElementById("alertBox");
            box.textContent = message;
            box.className = "alert " + type + " show";
            setTimeout(() => box.classList.remove("show"), 5000);
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const btn = document.getElementById("loginBtn");

            btn.disabled = true;
            btn.textContent = "Signing in...";

            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Login failed");

                const token = data.access_token;
                const userId = data.user.id;

                const roleEndpoint = currentTab === "admin"
                    ? `${API_URL}/api/admin/all-hospitals`
                    : `${API_URL}/api/hospital/me`;

                const roleCheck = await fetch(roleEndpoint, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!roleCheck.ok) {
                    throw new Error(`This account is not registered as ${currentTab}`);
                }

                const store = document.getElementById("rememberMe").checked ? localStorage : sessionStorage;
                store.setItem("fl_token", token);
                store.setItem("fl_user", userId);
                store.setItem("fl_role", currentTab);

                showAlert("Login successful! Redirecting...", "success");
                setTimeout(() => {
                    window.location.href = currentTab === "admin" ? "admin.html" : "dashboard.html";
                }, 800);
            } catch (err) {
                showAlert(err.message || "Login failed.", "error");
                btn.disabled = false;
                btn.textContent = "Sign In";
            }
        }
    </script>
</body>
</html>
