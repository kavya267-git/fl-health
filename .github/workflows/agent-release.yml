# Builds the MediFed Hospital Agent for Windows when a tag "agent-v*" is pushed, and attaches
# MediFed-Hospital-Agent-Windows.zip to a GitHub Release for that tag.
# The API address pre-filled in the agent is DEFAULT_SERVER in hospital_agent/medifed_agent/defaults.py.
# The repository variable MEDIFED_API_URL (Settings > Secrets and variables > Actions > Variables), if set,
# overrides it. It is an address, not a secret.
name: Hospital agent release

on:
  push:
    tags: ["agent-v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the agent's dependencies (CPU-only PyTorch) and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r hospital_agent/requirements.txt pyinstaller --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Build
        env:
          MEDIFED_API_URL: ${{ vars.MEDIFED_API_URL }}
        run: |
          if ($env:MEDIFED_API_URL) { python hospital_agent/build_agent.py --server $env:MEDIFED_API_URL }
          else { python hospital_agent/build_agent.py }

      - name: Smoke test the headless program
        run: |
          & "hospital_agent/dist/MediFed-Hospital-Agent/medifed-agent.exe" --help

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: hospital_agent/dist/MediFed-Hospital-Agent-Windows.zip
          fail_on_unmatched_files: true
